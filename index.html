<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>棋盘地图编辑与试玩系统</title>
  <style>
    :root {
      --bg: #111418;
      --panel: #1b2026;
      --panel-2: #242b33;
      --text: #e9eef5;
      --muted: #9aa9bb;
      --accent: #58a6ff;
      --danger: #ff6b6b;
      --ok: #59d59b;
      --cell-size: 34px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    button, select, input {
      background: var(--panel-2);
      border: 1px solid #36414d;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    header {
      display: flex;
      gap: 16px;
      padding: 14px;
      align-items: center;
      flex-wrap: wrap;
      background: #0f1318;
      border-bottom: 1px solid #28323d;
    }
    .group {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      border: 1px solid #2f3945;
      padding: 8px;
      border-radius: 10px;
    }

    main {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }
    aside, .right {
      background: var(--panel);
      border: 1px solid #2e3946;
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }
    .board-wrap {
      background: var(--panel);
      border: 1px solid #2e3946;
      border-radius: 12px;
      overflow: auto;
      padding: 12px;
      min-height: 0;
    }
    #board {
      display: grid;
      gap: 2px;
      width: max-content;
      user-select: none;
      touch-action: none;
    }
    .cell {
      position: relative;
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 6px;
      border: 1px solid #1f252d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 120ms ease, filter 120ms ease;
      cursor: crosshair;
      overflow: hidden;
    }
    .cell[data-terrain="FIRE"] { background: #d14b43; }
    .cell[data-terrain="FOREST"] { background: #2f7a3f; }
    .cell[data-terrain="ROAD"] { background: #6f7b88; }
    .cell[data-terrain="MOUNTAIN"] { background: #2b2f35; }
    .cell[data-terrain="WATER"] { background: #2f5fd0; }

    .cell.invalid-flash {
      animation: invalidFlash 240ms ease 2;
    }
    @keyframes invalidFlash {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,.8); }
      100% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
    }

    .symbol { opacity: .92; pointer-events: none; }
    .marker { position:absolute; left:4px; top:2px; font-size:12px; z-index:4; }
    .player {
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #2f3640;
      box-shadow: 0 2px 8px rgba(0,0,0,.45);
      z-index: 2;
      transition: transform 120ms ease;
    }
    .player.bump { animation: bump 170ms ease; }
    .player.hurt { animation: hurt 280ms ease; }
    @keyframes bump {
      0% { transform: translate(0,0); }
      50% { transform: translate(var(--dx,0), var(--dy,0)); }
      100% { transform: translate(0,0); }
    }
    @keyframes hurt {
      0%,100% { transform: scale(1); background:#fff; }
      35% { transform: scale(.88); background:#ff6767; }
      70% { transform: scale(1.08); background:#ffd3d3; }
    }
    .floating {
      position: absolute;
      right: 8px;
      top: -6px;
      color: #ff7d7d;
      font-weight: 700;
      pointer-events: none;
      animation: float 650ms ease forwards;
      z-index: 3;
    }
    @keyframes float {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-16px); }
    }

    .terrain-item {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      border: 1px solid #3a4652;
      border-radius: 8px;
      cursor: pointer;
      background: #1d232b;
    }
    .terrain-item.active { border-color: var(--accent); }
    .terrain-dot { width: 14px; height: 14px; border-radius: 4px; }

    .hp {
      font-size: 28px;
      font-weight: 800;
      color: #ffd972;
      margin: 8px 0;
    }
    .status { color: var(--muted); font-size: 14px; }
    .touch-controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 46px);
      gap: 8px;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
    }
    .touch-btn {
      font-size: 20px;
      font-weight: 700;
      border-radius: 10px;
      min-height: 44px;
    }
    .touch-btn:active {
      transform: scale(0.96);
      border-color: var(--accent);
    }

    footer {
      min-height: 42px;
      padding: 10px 14px;
      border-top: 1px solid #2a3541;
      background: #0f1318;
      color: #d6e3f3;
    }



    .board-wrap { position: relative; }

    body.game-over-shake {
      animation: gameOverShake 80ms linear 6;
    }
    @keyframes gameOverShake {
      0% { transform: translate(0,0); }
      25% { transform: translate(4px,-2px); }
      50% { transform: translate(-4px,2px); }
      75% { transform: translate(3px,1px); }
      100% { transform: translate(0,0); }
    }

    #redFlash {
      position: fixed;
      inset: 0;
      background: rgba(200, 20, 20, 0.35);
      opacity: 0;
      pointer-events: none;
      z-index: 18;
    }
    #redFlash.show { animation: redFlash 500ms ease-in-out; }
    @keyframes redFlash {
      0%, 100% { opacity: 0; }
      20%, 60% { opacity: 1; }
    }

    #gameOverScreen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 19;
      pointer-events: none;
    }
    #gameOverScreen.show {
      display: flex;
      animation: gameOverFade 700ms ease forwards;
    }
    @keyframes gameOverFade {
      from { background: rgba(0,0,0,0); }
      to { background: rgba(0,0,0,.88); }
    }
    #gameOverText {
      color: #ff7373;
      font-size: clamp(28px, 7vw, 64px);
      font-weight: 900;
      letter-spacing: .08em;
      opacity: 0;
      transform: translateY(8px);
    }
    #gameOverScreen.show #gameOverText {
      animation: textFadeIn 700ms 160ms ease forwards;
    }
    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #gameOverModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 11vh;
      z-index: 20;
    }
    #gameOverModal.show { display: flex; }
    .modal {
      background: #1f2630;
      border: 1px solid #3b4a59;
      border-radius: 12px;
      padding: 20px 22px 26px;
      width: min(90vw, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .modal h3 { margin: 0; }

    #winOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.62);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 21;
    }
    #winOverlay.show { display: flex; }
    .win-modal {
      background: #1f2630;
      border: 1px solid #3b4a59;
      border-radius: 14px;
      width: min(90vw, 380px);
      text-align: center;
      padding: 26px 20px;
      box-shadow: 0 10px 28px rgba(0,0,0,.38);
      transform: scale(0.82);
      opacity: 0;
    }
    #winOverlay.show .win-modal {
      animation: winPop 420ms ease forwards;
    }
    @keyframes winPop {
      0% { transform: scale(0.82); opacity: 0; }
      55% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .win-title {
      margin: 0 0 14px;
      color: #7df2b0;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 900;
      letter-spacing: .04em;
    }

    .goal-cell {
      box-shadow: inset 0 0 0 2px #ffd966, 0 0 12px rgba(255, 217, 102, .65);
      animation: goalPulse 1.2s ease-in-out infinite;
    }
    @keyframes goalPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
  </style>
</head>
<body>
  <header>
    <div class="group">
      <label>宽<input id="widthInput" type="number" min="2" max="60" value="10" style="width:70px"/></label>
      <label>高<input id="heightInput" type="number" min="2" max="60" value="10" style="width:70px"/></label>
      <button id="newMapBtn">新建/改尺寸</button>
      <button id="randomMapBtn">随机生成地图</button>
      <button id="resetBtn">重置为道路</button>
    </div>
    <div class="group">
      <button id="undoBtn">撤销</button>
      <button id="redoBtn">重做</button>
      <span id="brushLabel" class="status">画笔：道路</span>
    </div>
    <div class="group">
      <button id="modeBtn">进入试玩模式</button>
      <button id="saveBtn">保存地图</button>
      <button id="loadBtn">读取地图</button>
      <input id="loadFileInput" type="file" accept="application/json" hidden />
    </div>
  </header>

  <main>
    <aside>
      <h3>地形画笔</h3>
      <div id="terrainList"></div>
      <p class="status">编辑模式支持：单点绘制 + 鼠标拖拽框选绘制（矩形填充）。</p>
    </aside>

    <section class="board-wrap">
      <div id="board"></div>
    </section>

    <section class="right">
      <h3>角色信息</h3>
      <div>模式：<strong id="modeText">编辑模式</strong></div>
      <div class="hp">HP: <span id="hpText">-</span></div>
      <div>道路计数：<span id="roadCounterText">-</span></div>
      <p class="status">试玩移动：键盘方向键 / WASD，或点击相邻格。</p>
      <div id="touchControls" class="touch-controls">
        <button class="touch-btn" data-dx="0" data-dy="-1">↑</button>
        <span></span>
        <button class="touch-btn" data-dx="0" data-dy="1">↓</button>
        <button class="touch-btn" data-dx="-1" data-dy="0">←</button>
        <span></span>
        <button class="touch-btn" data-dx="1" data-dy="0">→</button>
      </div>
    </section>
  </main>

  <footer id="tipBar">准备就绪。</footer>

  <div id="redFlash"></div>
  <div id="gameOverScreen">
    <div id="gameOverText">Game Over</div>
  </div>

  <div id="gameOverModal">
    <div class="modal">
      <h3>游戏结束</h3>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>

  <div id="winOverlay">
    <div class="win-modal">
      <h2 class="win-title">游戏胜利！</h2>
      <button id="winRestartBtn">重新开始</button>
    </div>
  </div>

  <script>
    const TERRAIN = {
      FIRE: { key: 'FIRE', name: '火焰', color: '#d14b43', symbol: '🔥', passable: true },
      FOREST: { key: 'FOREST', name: '森林', color: '#2f7a3f', symbol: '🌲', passable: false },
      ROAD: { key: 'ROAD', name: '道路', color: '#6f7b88', symbol: '🛣', passable: true },
      MOUNTAIN: { key: 'MOUNTAIN', name: '山脉', color: '#2b2f35', symbol: '⛰', passable: false },
      WATER: { key: 'WATER', name: '湖泊', color: '#2f5fd0', symbol: '🌊', passable: false }
    };
    const TERRAIN_KEYS = Object.keys(TERRAIN);

    const state = {
      width: 10,
      height: 10,
      grid: [],
      mode: 'EDITOR',
      brush: 'ROAD',
      history: [],
      historyIndex: -1,
      dragStart: null,
      player: null,
      gameOver: false,
      movingLock: false,
      spawn: null,
      goal: null,
      gameWon: false,
      audioCtx: null,
      fireLakeCounter: new Map()
    };

    const el = {
      widthInput: document.getElementById('widthInput'),
      heightInput: document.getElementById('heightInput'),
      newMapBtn: document.getElementById('newMapBtn'),
      randomMapBtn: document.getElementById('randomMapBtn'),
      resetBtn: document.getElementById('resetBtn'),
      undoBtn: document.getElementById('undoBtn'),
      redoBtn: document.getElementById('redoBtn'),
      modeBtn: document.getElementById('modeBtn'),
      saveBtn: document.getElementById('saveBtn'),
      loadBtn: document.getElementById('loadBtn'),
      loadFileInput: document.getElementById('loadFileInput'),
      terrainList: document.getElementById('terrainList'),
      brushLabel: document.getElementById('brushLabel'),
      board: document.getElementById('board'),
      modeText: document.getElementById('modeText'),
      hpText: document.getElementById('hpText'),
      roadCounterText: document.getElementById('roadCounterText'),
      tipBar: document.getElementById('tipBar'),
      gameOverModal: document.getElementById('gameOverModal'),
      gameOverScreen: document.getElementById('gameOverScreen'),
      redFlash: document.getElementById('redFlash'),
      restartBtn: document.getElementById('restartBtn'),
      touchControls: document.getElementById('touchControls'),
      winOverlay: document.getElementById('winOverlay'),
      winRestartBtn: document.getElementById('winRestartBtn')
    };

    function tip(text) {
      el.tipBar.textContent = text;
    }

    function createGrid(w, h, terrain = 'ROAD') {
      return Array.from({ length: h }, (_, y) => (
        Array.from({ length: w }, (_, x) => ({ x, y, terrain }))
      ));
    }

    function cloneGrid(grid) {
      return grid.map(row => row.map(c => ({ ...c })));
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function generateMainRoad(w, h) {
      const cells = [];
      let x = 0;
      let y = randInt(0, h - 1);
      cells.push({ x, y });
      while (x < w - 1) {
        const options = [];
        options.push({ x: x + 1, y, weight: 4 });
        if (y > 0) options.push({ x, y: y - 1, weight: 1 });
        if (y < h - 1) options.push({ x, y: y + 1, weight: 1 });
        const pool = options.flatMap(o => Array.from({ length: o.weight }, () => o));
        const next = pickRandom(pool);
        x = next.x;
        y = next.y;
        if (!cells.some(c => c.x === x && c.y === y)) cells.push({ x, y });
      }
      return cells;
    }

    function autoGenerateMap(w = 10, h = 10) {
      const grid = createGrid(w, h, 'FOREST');
      const mainRoad = generateMainRoad(w, h);
      const roadSet = new Set(mainRoad.map(c => `${c.x},${c.y}`));

      const branchCount = randInt(2, 4);
      for (let i = 0; i < branchCount; i++) {
        const base = pickRandom(mainRoad);
        let x = base.x;
        let y = base.y;
        const steps = randInt(2, 5);
        for (let j = 0; j < steps; j++) {
          const moves = [
            [1, 0], [-1, 0], [0, 1], [0, -1]
          ].map(([dx, dy]) => ({ x: x + dx, y: y + dy }))
            .filter(p => isInBoundsStatic(p.x, p.y, w, h));
          if (!moves.length) break;
          const next = pickRandom(moves);
          x = next.x; y = next.y;
          roadSet.add(`${x},${y}`);
        }
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const key = `${x},${y}`;
          if (roadSet.has(key)) {
            grid[y][x].terrain = 'ROAD';
          } else {
            grid[y][x].terrain = pickRandom(['FOREST', 'MOUNTAIN', 'WATER']);
          }
        }
      }

      const spawn = mainRoad[0];
      const goal = mainRoad[mainRoad.length - 1];

      const candidates = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const key = `${x},${y}`;
          if (x === spawn.x && y === spawn.y) continue;
          if (key === `${goal.x},${goal.y}`) continue;
          if (mainRoad.some(c => c.x === x && c.y === y)) continue;
          candidates.push({ x, y });
        }
      }

      const minFire = Math.ceil(w * h * 0.2);
      const fireCount = Math.min(candidates.length, randInt(minFire, Math.max(minFire, minFire + 6)));
      for (let i = 0; i < fireCount; i++) {
        const idx = randInt(0, candidates.length - 1);
        const c = candidates.splice(idx, 1)[0];
        grid[c.y][c.x].terrain = 'FIRE';
      }

      return { grid, spawn, goal };
    }

    function isInBoundsStatic(x, y, w, h) {
      return x >= 0 && y >= 0 && x < w && y < h;
    }

    function ensureAudioContext() {
      if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
      return state.audioCtx;
    }

    function playTone({ freq = 440, type = 'sine', duration = 0.2, volume = 0.05, loopRate = 0 }) {
      const ctx = ensureAudioContext();
      const start = ctx.currentTime;
      const end = start + duration;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      gain.connect(ctx.destination);

      if (loopRate > 0) {
        let t = start;
        while (t < end) {
          const osc = ctx.createOscillator();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          osc.connect(gain);
          osc.start(t);
          osc.stop(Math.min(end, t + loopRate * 0.9));
          t += loopRate;
        }
      } else {
        const osc = ctx.createOscillator();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        osc.connect(gain);
        osc.start(start);
        osc.stop(end);
      }
    }

    function playRoadStepSound() {
      playTone({ freq: 520, type: 'triangle', duration: 0.09, volume: 0.04 });
    }

    function playFireSound() {
      playTone({ freq: 180, type: 'sawtooth', duration: 0.95, volume: 0.035, loopRate: 0.12 });
    }

    function playGameOverSound() {
      playTone({ freq: 130, type: 'square', duration: 0.95, volume: 0.04, loopRate: 0.15 });
    }

    function playVictorySound() {
      const ctx = ensureAudioContext();
      const now = ctx.currentTime;
      const tones = [523.25, 659.25, 783.99, 1046.5];
      tones.forEach((freq, idx) => {
        const t = now + idx * 0.12;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.18);
      });
    }

    function fitBoardToViewport() {
      const wrap = document.querySelector('.board-wrap');
      if (!wrap) return;
      const usableW = Math.max(320, wrap.clientWidth - 24);
      const usableH = Math.max(320, wrap.clientHeight - 24);
      const size = Math.max(24, Math.min(46, Math.floor(Math.min(usableW / state.width, usableH / state.height))));
      document.documentElement.style.setProperty('--cell-size', `${size}px`);
    }

    function pushHistory(changes) {
      if (!changes.length) return;
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(changes);
      state.historyIndex += 1;
      refreshUndoRedo();
    }

    function refreshUndoRedo() {
      el.undoBtn.disabled = state.mode !== 'EDITOR' || state.historyIndex < 0;
      el.redoBtn.disabled = state.mode !== 'EDITOR' || state.historyIndex >= state.history.length - 1;
    }

    function applyCells(changes, reverse = false) {
      for (const c of changes) {
        const target = state.grid[c.y][c.x];
        target.terrain = reverse ? c.before : c.after;
      }
    }

    function undo() {
      if (state.historyIndex < 0) return;
      const changes = state.history[state.historyIndex];
      applyCells(changes, true);
      state.historyIndex -= 1;
      renderBoard();
      refreshUndoRedo();
      tip('已撤销一步编辑。');
    }

    function redo() {
      if (state.historyIndex >= state.history.length - 1) return;
      state.historyIndex += 1;
      const changes = state.history[state.historyIndex];
      applyCells(changes, false);
      renderBoard();
      refreshUndoRedo();
      tip('已重做一步编辑。');
    }

    function terrainSymbol(k) { return TERRAIN[k]?.symbol || '?'; }

    function renderTerrainPanel() {
      el.terrainList.innerHTML = '';
      for (const key of TERRAIN_KEYS) {
        const t = TERRAIN[key];
        const item = document.createElement('button');
        item.className = `terrain-item${state.brush === key ? ' active' : ''}`;
        item.innerHTML = `<span class="terrain-dot" style="background:${t.color}"></span><span>${t.name} ${t.symbol}</span>`;
        item.onclick = () => {
          state.brush = key;
          el.brushLabel.textContent = `画笔：${t.name}`;
          renderTerrainPanel();
        };
        el.terrainList.appendChild(item);
      }
    }

    function renderBoard() {
      fitBoardToViewport();
      el.board.style.gridTemplateColumns = `repeat(${state.width}, var(--cell-size))`;
      el.board.innerHTML = '';

      for (let y = 0; y < state.height; y++) {
        for (let x = 0; x < state.width; x++) {
          const cell = state.grid[y][x];
          const d = document.createElement('div');
          d.className = 'cell';
          d.dataset.x = x;
          d.dataset.y = y;
          d.dataset.terrain = cell.terrain;
          d.innerHTML = `<span class="symbol">${terrainSymbol(cell.terrain)}</span>`;
          if (state.spawn && state.spawn.x === x && state.spawn.y === y) {
            d.innerHTML += '<span class="marker">🏠</span>';
          }
          if (state.goal && state.goal.x === x && state.goal.y === y) {
            d.classList.add('goal-cell');
            d.innerHTML += '<span class="marker" style="left:auto;right:4px;">🏁</span>';
          }

          d.addEventListener('mousedown', onCellMouseDown);
          d.addEventListener('mouseenter', onCellMouseEnter);
          d.addEventListener('mouseup', onCellMouseUp);
          d.addEventListener('click', onCellClickPlay);

          if (state.player && state.player.x === x && state.player.y === y) {
            const p = document.createElement('div');
            p.className = 'player';
            d.appendChild(p);
          }
          el.board.appendChild(d);
        }
      }
      updateSideInfo();
    }

    function collectRectCells(a, b) {
      const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
      const minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
      const cells = [];
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) cells.push({ x, y });
      }
      return cells;
    }

    function paintCells(cells) {
      const changes = [];
      for (const { x, y } of cells) {
        const c = state.grid[y][x];
        if (c.terrain === state.brush) continue;
        changes.push({ x, y, before: c.terrain, after: state.brush });
        c.terrain = state.brush;
      }
      if (changes.length) {
        pushHistory(changes);
        renderBoard();
      }
    }

    function onCellMouseDown(e) {
      if (state.mode !== 'EDITOR') return;
      const x = Number(e.currentTarget.dataset.x);
      const y = Number(e.currentTarget.dataset.y);
      state.dragStart = { x, y };
      e.preventDefault();
    }

    function onCellMouseEnter(_) {
      // 可扩展：拖拽预览
    }

    function onCellMouseUp(e) {
      if (state.mode !== 'EDITOR' || !state.dragStart) return;
      const x = Number(e.currentTarget.dataset.x);
      const y = Number(e.currentTarget.dataset.y);
      const rectCells = collectRectCells(state.dragStart, { x, y });
      paintCells(rectCells);
      state.dragStart = null;
    }

    function isInBounds(x, y) {
      return x >= 0 && y >= 0 && x < state.width && y < state.height;
    }

    function onCellClickPlay(e) {
      if (state.mode !== 'PLAY' || !state.player || state.gameOver || state.gameWon) return;
      const x = Number(e.currentTarget.dataset.x);
      const y = Number(e.currentTarget.dataset.y);
      tryMoveTo(x, y);
    }

    function randomRoadCell() {
      const roads = [];
      for (const row of state.grid) {
        for (const c of row) if (c.terrain === 'ROAD') roads.push(c);
      }
      if (!roads.length) return null;
      return roads[Math.floor(Math.random() * roads.length)];
    }

    function startPlayMode() {
      const spawn = state.spawn || randomRoadCell();
      if (!spawn) {
        tip('没有道路格，无法进入试玩模式。');
        return;
      }
      state.mode = 'PLAY';
      state.player = { x: spawn.x, y: spawn.y, hp: 10, roadStepCounter: 0 };
      ensureAudioContext();
      state.gameOver = false;
      state.gameWon = false;
      state.movingLock = false;
      el.winOverlay.classList.remove('show');
      el.modeBtn.textContent = '返回编辑模式';
      el.modeText.textContent = '试玩模式';
      tip('已进入试玩模式。');
      refreshUndoRedo();
      renderBoard();
    }

    function backToEditorMode() {
      state.mode = 'EDITOR';
      state.player = null;
      state.gameOver = false;
      state.gameWon = false;
      state.movingLock = false;
      el.modeBtn.textContent = '进入试玩模式';
      el.modeText.textContent = '编辑模式';
      el.gameOverModal.classList.remove('show');
      el.gameOverScreen.classList.remove('show');
      el.redFlash.classList.remove('show');
      el.winOverlay.classList.remove('show');
      document.body.classList.remove('game-over-shake');
      tip('已返回编辑模式。');
      refreshUndoRedo();
      renderBoard();
    }

    function updateSideInfo() {
      if (!state.player) {
        el.hpText.textContent = '-';
        el.roadCounterText.textContent = '-';
      } else {
        el.hpText.textContent = state.player.hp;
        el.roadCounterText.textContent = state.player.roadStepCounter;
      }
    }

    function showInvalidFeedback(tx, ty, reason) {
      const cell = [...el.board.children].find(c => Number(c.dataset.x) === tx && Number(c.dataset.y) === ty);
      if (cell) {
        cell.classList.add('invalid-flash');
        setTimeout(() => cell.classList.remove('invalid-flash'), 500);
      }
      const p = document.querySelector('.player');
      if (p && state.player) {
        let dx = 0, dy = 0;
        if (Number.isFinite(tx) && Number.isFinite(ty)) {
          dx = Math.sign(tx - state.player.x) * 4;
          dy = Math.sign(ty - state.player.y) * 4;
        }
        p.style.setProperty('--dx', `${dx}px`);
        p.style.setProperty('--dy', `${dy}px`);
        p.classList.remove('bump');
        void p.offsetWidth;
        p.classList.add('bump');
      }
      tip(`无法移动到该位置（${reason}）`);
    }

    function triggerFireFeedback(x, y) {
      const p = document.querySelector('.player');
      if (p) {
        p.classList.remove('hurt');
        void p.offsetWidth;
        p.classList.add('hurt');
      }
      const cell = [...el.board.children].find(c => Number(c.dataset.x) === x && Number(c.dataset.y) === y);
      if (cell) {
        cell.classList.add('invalid-flash');
        const f = document.createElement('div');
        f.className = 'floating';
        f.textContent = '-1';
        cell.appendChild(f);
        setTimeout(() => {
          cell.classList.remove('invalid-flash');
          f.remove();
        }, 700);
      }
    }

    function triggerGameOverSequence() {
      playGameOverSound();
      document.body.classList.add('game-over-shake');
      el.redFlash.classList.remove('show');
      void el.redFlash.offsetWidth;
      el.redFlash.classList.add('show');
      setTimeout(() => {
        document.body.classList.remove('game-over-shake');
        el.gameOverScreen.classList.add('show');
        el.gameOverModal.classList.add('show');
      }, 500);
    }

    function triggerVictorySequence() {
      state.gameWon = true;
      state.movingLock = true;
      playVictorySound();
      el.winOverlay.classList.add('show');
      tip('到达终点，游戏胜利！');
    }

    function processTerrainEffect(terrain, x, y) {
      if (!state.player) return;
      if (terrain === 'FIRE') {
        state.player.hp -= 1;
        triggerFireFeedback(x, y);
        playFireSound();
        tip('踩到火焰，HP -1');
        state.player.roadStepCounter = 0;
      } else if (terrain === 'ROAD') {
        state.player.roadStepCounter += 1;
        playRoadStepSound();
        tip('进入道路，累计步数 +1');
      } else {
        state.player.roadStepCounter = 0;
      }

      if (state.player.hp <= 0) {
        state.player.hp = 0;
        state.gameOver = true;
        triggerGameOverSequence();
      }
    }

    function getNeighbors4(x, y) {
      return [
        [x + 1, y],
        [x - 1, y],
        [x, y + 1],
        [x, y - 1]
      ].filter(([nx, ny]) => isInBounds(nx, ny));
    }

    function hasNeighborTerrain(x, y, terrain) {
      return getNeighbors4(x, y).some(([nx, ny]) => state.grid[ny][nx].terrain === terrain);
    }

    function evolveTerrainPerTurn() {
      const toFire = [];
      const toForest = [];
      const nextCounter = new Map();

      for (let y = 0; y < state.height; y++) {
        for (let x = 0; x < state.width; x++) {
          const cell = state.grid[y][x];
          const key = `${x},${y}`;
          if (cell.terrain === 'FOREST' && hasNeighborTerrain(x, y, 'FIRE')) {
            toFire.push({ x, y });
          }
          if (cell.terrain === 'FIRE') {
            if (hasNeighborTerrain(x, y, 'WATER')) {
              const turns = (state.fireLakeCounter.get(key) || 0) + 1;
              if (turns >= 3) {
                toForest.push({ x, y });
              } else {
                nextCounter.set(key, turns);
              }
            }
          }
        }
      }

      for (const p of toFire) state.grid[p.y][p.x].terrain = 'FIRE';
      for (const p of toForest) state.grid[p.y][p.x].terrain = 'FOREST';
      state.fireLakeCounter = nextCounter;
    }

    function tryMoveTo(tx, ty) {
      if (!state.player || state.movingLock) return;
      if (!isInBounds(tx, ty)) {
        showInvalidFeedback(tx, ty, '越界');
        return;
      }
      const dist = Math.abs(tx - state.player.x) + Math.abs(ty - state.player.y);
      if (dist !== 1) {
        showInvalidFeedback(tx, ty, '仅可上下左右相邻移动');
        return;
      }

      const targetTerrain = state.grid[ty][tx].terrain;
      if (!TERRAIN[targetTerrain].passable) {
        showInvalidFeedback(tx, ty, `${TERRAIN[targetTerrain].name}不可进入`);
        return;
      }

      state.player.x = tx;
      state.player.y = ty;
      state.movingLock = true;
      renderBoard();
      processTerrainEffect(targetTerrain, tx, ty);
      if (!state.gameOver && state.goal && tx === state.goal.x && ty === state.goal.y) {
        triggerVictorySequence();
      }
      evolveTerrainPerTurn();
      updateSideInfo();
      setTimeout(() => {
        state.movingLock = state.gameWon;
        renderBoard();
      }, 180);
    }

    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        if (state.mode !== 'PLAY' || !state.player || state.gameOver || state.gameWon) return;
        const map = {
          ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
          w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
        };
        const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (!map[key]) return;
        e.preventDefault();
        const [dx, dy] = map[key];
        tryMoveTo(state.player.x + dx, state.player.y + dy);
      });
    }

    function setupTouchControls() {
      const buttons = el.touchControls.querySelectorAll('.touch-btn');
      for (const btn of buttons) {
        btn.addEventListener('pointerdown', (e) => {
          if (state.mode !== 'PLAY' || !state.player || state.gameOver || state.gameWon) return;
          e.preventDefault();
          const dx = Number(btn.dataset.dx);
          const dy = Number(btn.dataset.dy);
          tryMoveTo(state.player.x + dx, state.player.y + dy);
        });
      }
    }

    function resetMapToRoad() {
      const changes = [];
      for (const row of state.grid) {
        for (const c of row) {
          if (c.terrain !== 'ROAD') {
            changes.push({ x: c.x, y: c.y, before: c.terrain, after: 'ROAD' });
            c.terrain = 'ROAD';
          }
        }
      }
      if (changes.length) pushHistory(changes);
      state.spawn = null;
      state.goal = null;
      state.fireLakeCounter = new Map();
      renderBoard();
      tip('地图已重置为道路。');
    }

    function resizeOrNewMap() {
      if (state.mode !== 'EDITOR') {
        tip('请先返回编辑模式再修改尺寸。');
        return;
      }
      const w = 10;
      const h = 10;
      if (!confirm(`确认自动生成 ${w} x ${h} 地图吗？当前地图将被清空。`)) return;
      const generated = autoGenerateMap(w, h);
      state.width = w;
      state.height = h;
      state.grid = generated.grid;
      state.spawn = generated.spawn;
      state.goal = generated.goal;
      state.fireLakeCounter = new Map();
      state.history = [];
      state.historyIndex = -1;
      el.widthInput.value = w;
      el.heightInput.value = h;
      renderBoard();
      refreshUndoRedo();
      tip(`地图已自动生成：${w} x ${h}（含连续主干道）`);
    }

    function regenerateMap() {
      if (state.mode !== 'EDITOR') {
        tip('请先返回编辑模式再随机生成地图。');
        return;
      }
      const generated = autoGenerateMap(state.width, state.height);
      state.grid = generated.grid;
      state.spawn = generated.spawn;
      state.goal = generated.goal;
      state.fireLakeCounter = new Map();
      state.history = [];
      state.historyIndex = -1;
      renderBoard();
      refreshUndoRedo();
      tip(`已随机生成地图：${state.width} x ${state.height}`);
    }

    function saveMap() {
      const mapData = {
        width: state.width,
        height: state.height,
        grid: state.grid.map(row => row.map(c => c.terrain))
      };
      const blob = new Blob([JSON.stringify(mapData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `map_${state.width}x${state.height}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      tip('地图已保存（JSON）。');
    }

    function loadMapFromFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (!Number.isInteger(data.width) || !Number.isInteger(data.height) || !Array.isArray(data.grid)) {
            throw new Error('格式非法');
          }
          const grid = createGrid(data.width, data.height, 'ROAD');
          for (let y = 0; y < data.height; y++) {
            for (let x = 0; x < data.width; x++) {
              const t = data.grid?.[y]?.[x];
              grid[y][x].terrain = TERRAIN[t] ? t : 'ROAD';
            }
          }
          state.width = data.width;
          state.height = data.height;
          state.grid = grid;
          state.spawn = null;
          state.goal = null;
          state.fireLakeCounter = new Map();
          state.history = [];
          state.historyIndex = -1;
          if (state.mode === 'PLAY') backToEditorMode();
          renderBoard();
          refreshUndoRedo();
          el.widthInput.value = state.width;
          el.heightInput.value = state.height;
          tip('地图读取成功。');
        } catch (err) {
          tip(`读取失败：${err.message}`);
        }
      };
      reader.readAsText(file);
    }

    function restartGame() {
      if (state.mode !== 'PLAY') return;
      const spawn = randomRoadCell();
      if (!spawn) {
        tip('地图无道路格，无法重新开始。');
        return;
      }
      state.player = { x: spawn.x, y: spawn.y, hp: 10, roadStepCounter: 0 };
      state.fireLakeCounter = new Map();
      ensureAudioContext();
      state.gameOver = false;
      state.gameWon = false;
      state.movingLock = false;
      el.gameOverModal.classList.remove('show');
      el.gameOverScreen.classList.remove('show');
      el.redFlash.classList.remove('show');
      el.winOverlay.classList.remove('show');
      document.body.classList.remove('game-over-shake');
      renderBoard();
      tip('已重新开始。');
    }

    function init() {
      const generated = autoGenerateMap(state.width, state.height);
      state.grid = generated.grid;
      state.spawn = generated.spawn;
      state.goal = generated.goal;
      state.fireLakeCounter = new Map();
      el.widthInput.value = state.width;
      el.heightInput.value = state.height;
      el.widthInput.disabled = true;
      el.heightInput.disabled = true;
      renderTerrainPanel();
      renderBoard();
      setupKeyboard();
      setupTouchControls();
      window.addEventListener('resize', renderBoard);
      refreshUndoRedo();

      el.newMapBtn.onclick = resizeOrNewMap;
      el.randomMapBtn.onclick = regenerateMap;
      el.resetBtn.onclick = resetMapToRoad;
      el.undoBtn.onclick = undo;
      el.redoBtn.onclick = redo;
      el.modeBtn.onclick = () => state.mode === 'EDITOR' ? startPlayMode() : backToEditorMode();
      el.saveBtn.onclick = saveMap;
      el.loadBtn.onclick = () => el.loadFileInput.click();
      el.loadFileInput.onchange = (ev) => {
        const file = ev.target.files?.[0];
        if (file) loadMapFromFile(file);
        ev.target.value = '';
      };
      el.restartBtn.onclick = restartGame;
      el.winRestartBtn.onclick = restartGame;
    }

    init();
  </script>
</body>
</html>
